name: CI

# Vercel ya corre el build en cada push por su integracion con GitHub, pero no
# corre nuestros tests. Esto es lo que agrega valor: que la calibracion del
# scoring no se rompa en silencio (ya paso una vez — ver CLAUDE.md decision #5).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
